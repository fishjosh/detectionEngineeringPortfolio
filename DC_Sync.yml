title: Detect replication of Active Domains
id: 779bfa8e-27d7-46ac-8562-965d74d079d1
status: experimental # experimental, test, stable
description: Detects replication of Active Directory domains, which is a common technique used by attackers to obtain password hashes from domain controllers. This rule looks for Event ID 4662 with the specific property and access values that indicate a replication request.
references:
  - https://attack.mitre.org/techniques/T1003/006/
author: Joshua Fishman
date: 2026-07-07
modified: 2026-07-07
tags:
  - attack.credential-access
  - attack.t1003.006
logsource:
  product: windows
  category: security
detection:
  selection:
    eventID: 4662
    Properties|contains: 1131f6ad-9c07-11d1-f79f-00c04fc2dcd2
    AccessMask: 0x100

  condition: selection
falsepositives:
  - Legitimate replication requests from other domain controllers
level: high # informational, low, medium, high, critical
